[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-prediction"
version = "0.1.0"
description = "Prova de conceito preliminar de previsão de utilização agregada."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "xgboost==3.2.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
# V3: redes neurais e modelo de espaço de estados. Fora do extra `test`; testes que dependem
# destes pacotes são pulados quando eles não estão instalados.
v3 = ["torch==2.14.1", "statsmodels==0.15.0"]
# Análise expandida da V3: relatório HTML interativo (sem ele, o HTML sai só com figuras estáticas).
analysis = ["plotly==7.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["cuda: exige GPU com CUDA; pulado quando torch.cuda.is_available() é falso"]
