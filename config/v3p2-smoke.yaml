# Smoke sintético da V3 Parte 2: frota sintética com fator comum e salto de nível no último dia.
# Não lê o Alibaba v2018 nem exige GPU; usado pela suíte de testes. Os números NÃO são resultado.
seed: 42
mode: smoke_synthetic
run_root: results/v3-part2-smoke
device: cpu
preregistration: null
data:
  source: synthetic
  usage_archive: data/alibaba-v2018/machine_usage.tar.gz
  meta_archive: data/alibaba-v2018/machine_meta.tar.gz
  cache_dir: data/processed
  chunk_rows: 2000000
  window:
    start_seconds: null
    end_seconds: null
  machines:
    ids: null
    sample_size: null
  granularity:
    sample_rows: 2000000
    min_conformity: 0.8
  grid_step: 300
  synthetic:
    n_machines: 24
    n_steps: 2304
    seed: 7
    inactive_machines: 1
    step_seconds: 300
    common_factor: 1.5
    level_shift_last_day: 4.0
    failure_domains: 3
  persist_panel: false
aggregation:
  strategy: cluster_weighted_cpu_num
  active_statuses:
  - USING
features:
  groups:
    cpu:
      columns:
      - cpu
      lags:
      - 5min
      - 10min
      - 15min
      - 30min
      - 60min
      windows:
      - 30min
      - 60min
    mem:
      columns:
      - mem
      lags:
      - 5min
      - 30min
      windows:
      - 30min
    net:
      columns:
      - net_in
      - net_out
      lags:
      - 5min
      - 30min
      windows:
      - 30min
    disk:
      columns:
      - disk
      lags:
      - 5min
      - 30min
      windows:
      - 30min
  ablation:
    A:
    - cpu
    B:
    - cpu
    - mem
    C:
    - cpu
    - mem
    - net
    - disk
horizons:
- 5min
- 15min
- 30min
trajectory_steps: 6
protocol:
  steps_per_day: 288
  development_days:
  - 3
  - 4
  inherited_test_day: 7
  expected_inherited_range:
  - 2010
  - 2297
  purge: 18
  inner:
    validation_size: 12h
    purge: 18
    min_train_size: 48h
    infeasible_policy: fail
  min_favorable_days: 3
reference:
  v2_dir: null
  v3_run: null
  reproduction_tolerance: 1.0e-06
  check_hashes: false
statistics:
  n_boot: 100
  primary_block_steps: 12
  sensitivity_blocks:
  - 6
  - 24
  practical_relevance: 0.05
  alpha: 0.05
panel:
  tolerance_pp: 0.0001
  min_train_coverage: 0.5
families:
  baselines:
    xgboost:
      grid:
        max_depth:
        - 3
        n_estimators:
        - 30
        learning_rate:
        - 0.1
      fixed: {}
      n_jobs: 1
    statespace:
      specification: local_level
      maxiter: 200
  robustness:
    networks:
    - dlinear
    - tcn
    - patchtst
    primary_network: dlinear
    seeds:
    - 42
    window: 36
    loop:
      max_epochs: 2
      patience: 5
      grad_clip_norm: 1.0
      batch_size: 64
      mixed_precision: auto
      finite_check_epochs: 2
    dlinear:
      linear:
      - shared
      learning_rate:
      - 0.001
      moving_average: 25
    tcn:
      channels:
      - 8
      dilations:
      - - 1
        - 2
        - 4
        - 8
      kernel_size: 3
      dropout: 0.1
      learning_rate: 0.001
    patchtst:
      patch_length: 12
      stride: 6
      d_model: 32
      heads: 2
      layers: 2
      dropout: 0.1
      learning_rate: 0.001
    recency_half_lives:
    - 144
    - 288
  hierarchical:
    criteria:
    - mean
    - volatility
    - profile
    - failure_domain
    k_values:
    - 2
    - 4
    reconciliation:
    - bottom_up
    - ols
    - mint_shrink
    min_group_size: 2
    profile_n_init: 2
    shrinkage: auto
    n_jobs: 1
  global_model:
    enabled: true
    n_machines: 12
    origin_stride: 2
    scale_machines:
    - 6
    - 12
    scale_day: 4
    grid:
    - max_depth: 3
      n_estimators: 30
      learning_rate: 0.1
    n_jobs: 1
    device: cpu
    tcn:
      enabled: true
      gate_ratio: 10.0
      window: 36
      channels: 4
      dilations:
      - 1
      - 2
      - 4
      - 8
      kernel_size: 3
      dropout: 0.1
      learning_rate: 0.001
      batch_size: 128
      examples_per_epoch: 2000
      max_epochs: 2
      patience: 1
      seeds:
      - 42
  regimes:
    slope_steps: 6
    volatility_steps: 12
    volatility_quantile: 0.8
    rise_quantile: 0.75
    fall_quantile: 0.25
    min_regime_origins: 5
    experts:
    - persistence
    - xgboost_v2
    - xgboost_delta
    - hybrid
  peaks:
    lambdas:
    - 0
    - 1
    - 3
    max_mae_increase: 0.05
    peak_quantile: 0.9
    merge_gap: 1
    tolerance: 1
  calibration:
    quantiles:
    - 0.05
    - 0.5
    - 0.9
    - 0.95
    methods:
    - static
    - rolling
    - aci
    - spci
    primary_method: aci
    rolling_windows:
    - 288
    - 144
    aci_gammas:
    - 0.005
    - 0.02
    window_hours: 6
    spci:
      enabled: true
      budget_minutes: 30
      lags: 12
      n_estimators: 20
  energy:
    substitutes: config/specpower_substitutes.yaml
    exponents:
    - 1.0
    - 1.4
    - 1.8
    models:
    - persistence
    - xgboost_v2
    - hybrid
    - hierarchical
    - global
    group_k_sensitivity:
    - 2
    - 4
    heterogeneous: true
    bootstrap_window_steps: 6
pretrained:
  enabled: false
  model: null
  version: null
  corpus_source: null
  excludes_alibaba_2018: null
  assessment:
    decision: não executado
    reason: Chronos-2 lista o Alibaba Cluster Trace 2018 (5 min) no corpus de treino
      (Tabela 6 do relatório técnico, arXiv 2510.15821); o LOTSA, corpus do Moirai,
      contém alibaba_cluster_trace_2018; o corpus do Chronos-Bolt não é público. Nenhum
      dos três satisfaz o portão de proveniência.
    sources:
    - https://arxiv.org/html/2510.15821
    - https://huggingface.co/datasets/Salesforce/lotsa_data
    - https://huggingface.co/datasets/autogluon/chronos_datasets/discussions/4
