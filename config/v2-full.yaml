# V2 na frota inteira do Alibaba Cluster Trace v2018 (todas as máquinas de machine_usage).
# Idêntico a config/v2.yaml, exceto machines.sample_size: null (frota inteira) e output_dir.
# Resolve a decisão aberta "subconjunto de 200 vs frota inteira" do protocolo da V2.
seed: 42
output_dir: results/v2-full

data:
  usage_archive: data/alibaba-v2018/machine_usage.tar.gz
  meta_archive: data/alibaba-v2018/machine_meta.tar.gz
  cache_dir: data/processed
  chunk_rows: 2000000
  window:
    start_seconds: null
    end_seconds: null
  machines:
    ids: null
    sample_size: null        # frota inteira
  granularity:
    sample_rows: 2000000
    min_conformity: 0.8
  grid_step: 300

aggregation:
  strategy: cluster_weighted_cpu_num
  active_statuses: [USING]

cohort:
  enabled: true
  cpu_num: null
  min_machines: 10

features:
  groups:
    cpu:
      columns: [cpu]
      lags: [5min, 10min, 15min, 30min, 60min]
      windows: [30min, 60min]
    mem:
      columns: [mem]
      lags: [5min, 30min]
      windows: [30min]
    net:
      columns: [net_in, net_out]
      lags: [5min, 30min]
      windows: [30min]
    disk:
      columns: [disk]
      lags: [5min, 30min]
      windows: [30min]
  ablation:
    A: [cpu]
    B: [cpu, mem]
    C: [cpu, mem, net, disk]

horizons: [5min, 15min, 30min]

validation:
  strategy: expanding
  n_folds: 5
  validation_size: 12h
  test_size: 24h
  min_train_size: 48h
  purge: auto

models:
  names: [persistence, ridge, xgboost]
  ridge:
    alphas: [0.1, 1.0, 10.0, 100.0]
  xgboost:
    grid:
      max_depth: [3, 5]
      n_estimators: [100, 300]
      learning_rate: [0.05, 0.1]
    fixed: {}
    n_jobs: 1

error_analysis:
  peak_quantile: 0.9
  bootstrap:
    block_steps: 12
    n_boot: 5000
    sensitivity_blocks: [6, 24]
