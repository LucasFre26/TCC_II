# Smoke da V3 em série sintética: não lê o Alibaba v2018 nem exige GPU.
# Mesma estrutura de config/v3.yaml com tamanhos reduzidos. Os números não são resultado.
seed: 42
run_root: results/v3-smoke
device: cpu
data:
  source: synthetic
  usage_archive: data/alibaba-v2018/machine_usage.tar.gz
  meta_archive: data/alibaba-v2018/machine_meta.tar.gz
  cache_dir: data/processed
  chunk_rows: 2000000
  window:
    start_seconds: null
    end_seconds: null
  machines:
    ids: null
    sample_size: null
  granularity:
    sample_rows: 2000000
    min_conformity: 0.8
  grid_step: 300
  synthetic:
    n_machines: 12
    n_steps: 1000
    seed: 7
    inactive_machines: 1
    step_seconds: 300
aggregation:
  strategy: cluster_weighted_cpu_num
  active_statuses:
  - USING
cohort:
  enabled: true
  cpu_num: null
  min_machines: 3
features:
  groups:
    cpu:
      columns:
      - cpu
      lags:
      - 5min
      - 10min
      - 15min
      - 30min
      - 60min
      windows:
      - 30min
      - 60min
    mem:
      columns:
      - mem
      lags:
      - 5min
      - 30min
      windows:
      - 30min
    net:
      columns:
      - net_in
      - net_out
      lags:
      - 5min
      - 30min
      windows:
      - 30min
    disk:
      columns:
      - disk
      lags:
      - 5min
      - 30min
      windows:
      - 30min
  ablation:
    A:
    - cpu
    B:
    - cpu
    - mem
    C:
    - cpu
    - mem
    - net
    - disk
  distribution:
    enabled: true
    elevated_cpu_threshold: 80
    dispersion_change_steps: 6
    skewness: true
    skewness_max_undefined_fraction: 0.5
horizons:
- 5min
- 15min
- 30min
trajectory_steps: 6
validation:
  strategy: expanding
  n_folds: 3
  validation_size: 8h
  test_size: 16h
  min_train_size: 24h
  purge: auto
  nested:
    enabled: true
    validation_size: 4h
    purge: 18
    min_train_size: 8h
    infeasible_policy: fail
reference:
  v2_dir: null
  expected_test_range: null
  expected_weights: null
comparisons:
  pairs:
  - new_vs_persistence_A
  - new_vs_v2_xgboost_A
  - ablation_vs_A
  - d_vs_a
  - hybrid_vs_statespace
  d_contrast_models:
  - xgboost_delta
  - dlinear
  bootstrap:
    primary_block_steps: 12
    sensitivity_blocks:
    - 6
    - 24
    n_boot: 200
  peak_quantile: 0.9
families:
  residual:
    models:
    - persistence
    - xgboost_delta
    - statespace
    - hybrid
    configs:
    - A
    - B
    - C
    xgboost:
      grid:
        max_depth:
        - 2
        n_estimators:
        - 20
        learning_rate:
        - 0.1
      fixed: {}
      n_jobs: 1
    statespace:
      specifications:
      - local_level
      - local_linear_trend
      maxiter: 200
  neural:
    models:
    - dlinear
    - tcn
    - nbeatsx
    budget_hours: 1
    window_candidates:
    - 24
    - 48
    window_selection:
      linear: shared
      learning_rate: 0.001
    loop:
      max_epochs: 3
      patience: 2
      grad_clip_norm: 1.0
      batch_size: 64
      mixed_precision: auto
      finite_check_epochs: 2
    dlinear:
      linear:
      - shared
      learning_rate:
      - 0.001
      moving_average: 5
    tcn:
      channels:
      - 8
      dilations:
      - - 1
        - 2
        - 4
      - - 1
        - 2
        - 4
        - 8
      kernel_size: 3
      dropout: 0.1
      learning_rate: 0.001
    nbeatsx:
      width: 16
      layers: 2
      trend_degree: 3
      harmonics: 4
      learning_rate: 0.001
    d_carrier: dlinear
    extra_path_configs: []
    optional:
      enabled: true
      order:
      - nhits
      - patchtst
      patchtst_min_remaining_hours: 2
      nhits:
        pool_sizes:
        - 4
        - 2
        - 1
        width: 16
        layers: 2
        learning_rate: 0.001
      patchtst:
        patch_length: 8
        stride: 4
        d_model: 8
        heads: 2
        layers: 1
        dropout: 0.1
        learning_rate: 0.001
  quantile:
    quantiles:
    - 0.5
    - 0.9
    - 0.95
    configs:
    - A
    - B
    - C
    xgboost:
      grid:
        max_depth:
        - 2
        n_estimators:
        - 20
        learning_rate:
        - 0.1
      fixed: {}
      n_jobs: 1
    conformal:
      upper_quantile: 0.95
      auxiliary_quantile: 0.9
      min_residuals: 200
  energy:
    substitute: config/specpower_substitute.yaml
    exponents:
    - 1.0
    - 1.4
    - 1.8
    unstable_mean_utilization: 0.05
    trajectory_models:
    - persistence
    - statespace
    - ridge_v2
    - xgboost_v2
    - xgboost_delta
    - hybrid
    - dlinear
    - tcn
    - nbeatsx
    fleet_sum: true
    ridge_v2:
      alphas:
      - 0.1
      - 1.0
      - 10.0
      - 100.0
    xgboost_v2:
      grid:
        max_depth:
        - 2
        n_estimators:
        - 20
        learning_rate:
        - 0.1
      fixed: {}
      n_jobs: 1
