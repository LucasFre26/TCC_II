# Smoke real da V3 Parte 2: frota inteira do Alibaba v2018, bloco do dia 6 e teste herdado (reprodução).
# Grades, sementes e amostras reduzidas para medir tempo e memória. Os números NÃO são resultado.
seed: 42
mode: smoke_real
run_root: results/v3-part2-smoke-real
device: auto
preregistration: null
data:
