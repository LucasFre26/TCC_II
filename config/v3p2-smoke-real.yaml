      gate_ratio: 1.05
      window: 36
      channels: 16
      dilations:
      - 1
      - 2
      - 4
      - 8
      kernel_size: 3
      dropout: 0.1
      learning_rate: 0.001
      batch_size: 512
      examples_per_epoch: 20000
      max_epochs: 2
      patience: 3
      seeds:
      - 42
  regimes:
    slope_steps: 6
    volatility_steps: 12
    volatility_quantile: 0.8
    rise_quantile: 0.75
    fall_quantile: 0.25
    min_regime_origins: 20
    experts:
    - persistence
    - xgboost_v2
    - xgboost_delta
    - hybrid
  peaks:
    lambdas:
    - 0
    - 1
    - 3
    max_mae_increase: 0.05
    peak_quantile: 0.9
    merge_gap: 1
    tolerance: 1
  calibration:
    quantiles:
    - 0.05
    - 0.5
    - 0.9
    - 0.95
    methods:
    - static
    - rolling
    - aci
    - spci
    primary_method: aci
    rolling_windows:
    - 288
    - 144
    aci_gammas:
    - 0.005
    - 0.02
    window_hours: 6
    spci:
      enabled: true
      budget_minutes: 30
      lags: 12
      n_estimators: 100
  energy:
    substitutes: config/specpower_substitutes.yaml
    exponents:
    - 1.0
    - 1.4
    - 1.8
    models:
    - persistence
    - xgboost_v2
    - hybrid
    - hierarchical
    - global
    group_k_sensitivity:
    - 4
    - 8
    - 16
    heterogeneous: true
    bootstrap_window_steps: 6
pretrained:
  enabled: false
  model: null
  version: null
  corpus_source: null
  excludes_alibaba_2018: null
  assessment:
    decision: não executado
    reason: Chronos-2 lista o Alibaba Cluster Trace 2018 (5 min) no corpus de treino
      (Tabela 6 do relatório técnico, arXiv 2510.15821); o LOTSA, corpus do Moirai,
      contém alibaba_cluster_trace_2018; o corpus do Chronos-Bolt não é público. Nenhum
      dos três satisfaz o portão de proveniência.
    sources:
    - https://arxiv.org/html/2510.15821
    - https://huggingface.co/datasets/Salesforce/lotsa_data
    - https://huggingface.co/datasets/autogluon/chronos_datasets/discussions/4
