    - dlinear
    - tcn
    - patchtst
    primary_network: dlinear
    seeds:
    - 42
    window: 36
    loop:
      max_epochs: 3
      patience: 5
      grad_clip_norm: 1.0
      batch_size: 64
      mixed_precision: auto
      finite_check_epochs: 2
    dlinear:
