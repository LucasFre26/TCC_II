  usage_archive: data/alibaba-v2018/machine_usage.tar.gz
  meta_archive: data/alibaba-v2018/machine_meta.tar.gz
  cache_dir: data/processed
  chunk_rows: 2000000
  window:
    start_seconds: null
    end_seconds: null
  machines:
    ids: null
    sample_size: null
  granularity:
    sample_rows: 2000000
    min_conformity: 0.8
  grid_step: 300
  synthetic: null
  persist_panel: true
aggregation:
  strategy: cluster_weighted_cpu_num
  active_statuses:
  - USING
features:
  groups:
    cpu:
      columns:
      - cpu
      lags:
      - 5min
      - 10min
      - 15min
      - 30min
      - 60min
      windows:
      - 30min
      - 60min
    mem:
      columns:
      - mem
      lags:
      - 5min
      - 30min
      windows:
      - 30min
    net:
      columns:
      - net_in
      - net_out
      lags:
      - 5min
      - 30min
      windows:
      - 30min
    disk:
      columns:
      - disk
      lags:
      - 5min
      - 30min
      windows:
      - 30min
