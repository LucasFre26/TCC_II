        max_depth:
        - 3
        - 5
        n_estimators:
        - 100
        - 300
        learning_rate:
        - 0.05
        - 0.1
      fixed: {}
      n_jobs: 1
    statespace:
      specification: local_level
      maxiter: 200
  robustness:
