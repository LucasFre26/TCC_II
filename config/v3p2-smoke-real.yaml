    A:
    - cpu
    B:
    - cpu
    - mem
    C:
    - cpu
    - mem
    - net
    - disk
horizons:
- 5min
- 15min
- 30min
trajectory_steps: 6
protocol:
  steps_per_day: 288
  development_days:
  - 6
  inherited_test_day: 7
  expected_inherited_range:
  - 2010
  - 2297
  purge: 18
  inner:
    validation_size: 12h
    purge: 18
    min_train_size: 48h
    infeasible_policy: fail
  min_favorable_days: 3
reference:
  v2_dir: results/v2-full/main
  v3_run: results/v3/20261104T232620Z-5b659dad
  reproduction_tolerance: 1.0e-06
  check_hashes: true
statistics:
  n_boot: 200
  primary_block_steps: 12
  sensitivity_blocks:
  - 6
  - 24
  practical_relevance: 0.05
  alpha: 0.05
panel:
  tolerance_pp: 0.0001
  min_train_coverage: 0.5
