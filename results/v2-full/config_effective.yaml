config:
  seed: 42
  output_dir: results/v2-full
  data:
    usage_archive: data/alibaba-v2018/machine_usage.tar.gz
    meta_archive: data/alibaba-v2018/machine_meta.tar.gz
    cache_dir: data/processed
    chunk_rows: 2000000
    window:
      start_seconds: null
      end_seconds: null
    machines:
      ids: null
      sample_size: null
    granularity:
      sample_rows: 2000000
      min_conformity: 0.8
    grid_step: 300
  aggregation:
    strategy: cluster_weighted_cpu_num
    active_statuses:
    - USING
  cohort:
    enabled: true
    cpu_num: null
    min_machines: 10
  features:
    groups:
      cpu:
        columns:
        - cpu
        lags:
        - 5min
        - 10min
        - 15min
        - 30min
        - 60min
        windows:
        - 30min
        - 60min
      mem:
        columns:
        - mem
        lags:
        - 5min
        - 30min
        windows:
        - 30min
      net:
        columns:
        - net_in
        - net_out
        lags:
        - 5min
        - 30min
        windows:
        - 30min
      disk:
        columns:
        - disk
        lags:
        - 5min
        - 30min
        windows:
        - 30min
    ablation:
      A:
      - cpu
      B:
      - cpu
      - mem
      C:
      - cpu
      - mem
      - net
      - disk
  horizons:
  - 5min
  - 15min
  - 30min
  validation:
    strategy: expanding
    n_folds: 5
    validation_size: 12h
    test_size: 24h
    min_train_size: 48h
    purge: auto
  models:
    names:
    - persistence
    - ridge
    - xgboost
    ridge:
      alphas:
      - 0.1
      - 1.0
      - 10.0
      - 100.0
    xgboost:
      grid:
        max_depth:
        - 3
        - 5
        n_estimators:
        - 100
        - 300
        learning_rate:
        - 0.05
        - 0.1
      fixed: {}
      n_jobs: 1
  error_analysis:
    peak_quantile: 0.9
    bootstrap:
      block_steps: 12
      n_boot: 5000
      sensitivity_blocks:
      - 6
      - 24
resolved:
  step_seconds: 300.0
  horizon_steps:
  - 1
  - 3
  - 6
  max_window_steps: 12
  purge_steps: 18
  required_purge_steps: 18
  validation_steps: 144
  test_steps: 288
  min_train_steps: 576
  feature_columns:
    A:
    - cpu_t
    - cpu_lag_1
    - cpu_lag_2
    - cpu_lag_3
    - cpu_lag_6
    - cpu_lag_12
    - cpu_roll_mean_6
    - cpu_roll_std_6
    - cpu_roll_mean_12
    - cpu_roll_std_12
    - sin_day
    - cos_day
    B:
    - cpu_t
    - cpu_lag_1
    - cpu_lag_2
    - cpu_lag_3
    - cpu_lag_6
    - cpu_lag_12
    - cpu_roll_mean_6
    - cpu_roll_std_6
    - cpu_roll_mean_12
    - cpu_roll_std_12
    - mem_t
    - mem_lag_1
    - mem_lag_6
    - mem_roll_mean_6
    - mem_roll_std_6
    - sin_day
    - cos_day
    C:
    - cpu_t
    - cpu_lag_1
    - cpu_lag_2
    - cpu_lag_3
    - cpu_lag_6
    - cpu_lag_12
    - cpu_roll_mean_6
    - cpu_roll_std_6
    - cpu_roll_mean_12
    - cpu_roll_std_12
    - mem_t
    - mem_lag_1
    - mem_lag_6
    - mem_roll_mean_6
    - mem_roll_std_6
    - net_in_t
    - net_in_lag_1
    - net_in_lag_6
    - net_in_roll_mean_6
    - net_in_roll_std_6
    - net_out_t
    - net_out_lag_1
    - net_out_lag_6
    - net_out_roll_mean_6
    - net_out_roll_std_6
    - disk_t
    - disk_lag_1
    - disk_lag_6
    - disk_roll_mean_6
    - disk_roll_std_6
    - sin_day
    - cos_day
  group_lags_steps:
    cpu:
    - 1
    - 2
    - 3
    - 6
    - 12
    mem:
    - 1
    - 6
    net:
    - 1
    - 6
    disk:
    - 1
    - 6
  group_windows_steps:
    cpu:
    - 6
    - 12
    mem:
    - 6
    net:
    - 6
    disk:
    - 6
